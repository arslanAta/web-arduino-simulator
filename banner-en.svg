<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Arduino Simulator: wires are laid on the board, the code runs, the LED blinks">
  <style>
    text { font-family: Manrope, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .code { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
    /* One 9-second story: wires are laid, the code is typed, the program runs. */
    .wire { stroke-dasharray: 400; stroke-dashoffset: 400; animation: lay 9s ease-in-out infinite; }
    .w2 { animation-name: lay2; }
    @keyframes lay { 0% { stroke-dashoffset: 400 } 14%, 94% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 400 } }
    @keyframes lay2 { 0%, 14% { stroke-dashoffset: 400 } 28%, 94% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 400 } }
    .line { animation: type 9s steps(24, end) infinite; }
    .l1 { animation-name: type1 } .l2 { animation-name: type2 } .l3 { animation-name: type3 }
    @keyframes type1 { 0%, 28% { width: 0 } 36%, 94% { width: 330px } 100% { width: 0 } }
    @keyframes type2 { 0%, 36% { width: 0 } 44%, 94% { width: 330px } 100% { width: 0 } }
    @keyframes type3 { 0%, 44% { width: 0 } 52%, 94% { width: 330px } 100% { width: 0 } }
    .run { animation: run 9s linear infinite; }
    @keyframes run { 0%, 53% { opacity: .35 } 56%, 94% { opacity: 1 } 100% { opacity: .35 } }
    .glow, .lit, .pin13 { opacity: 0; animation: blink 9s steps(1, end) infinite; }
    @keyframes blink { 0%, 56% { opacity: 0 } 57%, 62% { opacity: 1 } 63%, 68% { opacity: 0 } 69%, 74% { opacity: 1 } 75%, 80% { opacity: 0 } 81%, 86% { opacity: 1 } 87%, 100% { opacity: 0 } }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    @media (prefers-reduced-motion: reduce) {
      .wire { animation: none; stroke-dashoffset: 0 } .line { animation: none; width: 330px }
      .run, .float { animation: none; opacity: 1 } .glow, .lit, .pin13 { animation: none; opacity: 1 }
    }
  </style>

  <rect width="1200" height="360" rx="28" fill="#eef1f8"/>

  <!-- brand -->
  <rect x="56" y="52" width="64" height="64" rx="20" fill="#4f46e5"/>
  <path d="M64 84c0-12 18-12 24 0s24 12 24 0-18-12-24 0-24 12-24 0z" fill="none" stroke="#fff" stroke-width="5.2"/>
  <text x="140" y="80" font-size="15" font-weight="700" fill="#4f46e5" letter-spacing="2">VIRTUAL LAB</text>
  <text x="140" y="112" font-size="30" font-weight="800" fill="#171a2b">Arduino Simulator</text>
  <text x="56" y="172" font-size="38" font-weight="800" fill="#171a2b">Build circuits. Write code.</text>
  <text x="56" y="216" font-size="38" font-weight="800" fill="#4f46e5">Just like a real board.</text>

  <!-- code being typed -->
  <rect x="56" y="240" width="420" height="92" rx="14" fill="#171a2b"/>
  <g class="code">
    <svg x="76" y="252" height="22" class="line l1"><text y="16" fill="#c4b5fd">digitalWrite<tspan fill="#e5e7eb">(13, </tspan><tspan fill="#fbbf24">HIGH</tspan><tspan fill="#e5e7eb">);</tspan></text></svg>
    <svg x="76" y="276" height="22" class="line l2"><text y="16" fill="#c4b5fd">delay<tspan fill="#e5e7eb">(</tspan><tspan fill="#86efac">500</tspan><tspan fill="#e5e7eb">);</tspan></text></svg>
    <svg x="76" y="300" height="22" class="line l3"><text y="16" fill="#c4b5fd">digitalWrite<tspan fill="#e5e7eb">(13, </tspan><tspan fill="#fbbf24">LOW</tspan><tspan fill="#e5e7eb">);</tspan></text></svg>
  </g>
  <g class="run">
    <rect x="386" y="252" width="76" height="28" rx="14" fill="#15803d"/>
    <path d="M400 259l10 7-10 7z" fill="#fff"/>
    <text x="417" y="271" font-size="13" font-weight="700" fill="#fff">Run</text>
  </g>

  <!-- table -->
  <rect x="640" y="36" width="524" height="288" rx="18" fill="#dfe5f0"/>
  <g class="float">
    <!-- Arduino Uno -->
    <rect x="672" y="99" width="180" height="130" rx="8" fill="#171a2b" opacity=".16"/>
    <rect x="668" y="92" width="180" height="130" rx="8" fill="#0a7c84" stroke="#06565c" stroke-width="2"/>
    <rect x="658" y="108" width="30" height="28" rx="2" fill="#cfd4d7"/>
    <rect x="660" y="172" width="26" height="30" rx="2" fill="#17191b"/>
    <rect x="708" y="98" width="130" height="9" rx="2" fill="#121416"/>
    <rect x="732" y="207" width="106" height="9" rx="2" fill="#121416"/>
    <rect x="742" y="140" width="76" height="22" rx="3" fill="#1d2023"/>
    <text x="722" y="188" font-size="13" font-weight="800" fill="#d9f3f2" letter-spacing="1">UNO</text>
    <circle cx="700" cy="150" r="4" fill="#f4d58a"/>
    <circle class="pin13" cx="700" cy="150" r="7" fill="#fbbf24"/>

    <!-- breadboard -->
    <rect x="924" y="88" width="212" height="170" rx="10" fill="#171a2b" opacity=".12"/>
    <rect x="920" y="82" width="212" height="170" rx="10" fill="#f7f8fb" stroke="#c9d1e0" stroke-width="2"/>
    <g fill="#b9c2d4">
      <g id="row"><circle cx="944" cy="112" r="3"/><circle cx="968" cy="112" r="3"/><circle cx="992" cy="112" r="3"/><circle cx="1016" cy="112" r="3"/><circle cx="1040" cy="112" r="3"/><circle cx="1064" cy="112" r="3"/><circle cx="1088" cy="112" r="3"/><circle cx="1112" cy="112" r="3"/></g>
      <use href="#row" y="24"/><use href="#row" y="48"/><use href="#row" y="84"/><use href="#row" y="108"/>
    </g>
    <rect x="932" y="170" width="188" height="6" rx="3" fill="#e3e8f1"/>

    <!-- resistor -->
    <path d="M968 160v-20M968 100v12" stroke="#9aa3b5" stroke-width="3" stroke-linecap="round"/>
    <rect x="961" y="112" width="14" height="30" rx="5" fill="#e8c88f"/>
    <path d="M961 120h14M961 127h14M961 134h14" stroke="#a8442d" stroke-width="3"/>

    <!-- LED -->
    <circle class="glow" cx="1040" cy="118" r="34" fill="#ef4444" opacity=".25" style="filter: blur(8px)"/>
    <path d="M1032 136v24M1048 136v24" stroke="#9aa3b5" stroke-width="3" stroke-linecap="round"/>
    <path d="M1022 136v-18a18 18 0 0 1 36 0v18z" fill="#b91c1c"/>
    <path class="lit" d="M1022 136v-18a18 18 0 0 1 36 0v18z" fill="#ff5b5b"/>
    <path d="M1030 112a10 10 0 0 1 10-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>

    <!-- wires -->
    <path class="wire" d="M770 102C770 40 968 40 968 100" fill="none" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>
    <path class="wire w2" d="M790 212C790 300 1048 300 1048 196" fill="none" stroke="#171a2b" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
